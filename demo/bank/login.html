<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DemoBank - Log in</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222}
.top{height:70px;background:#003087;display:flex;align-items:center;padding:0 40px}
.logo{width:160px;height:34px;background:#ffc439;border-radius:4px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#003087}
.card{width:400px;margin:80px auto 0;padding:28px 30px;background:#fafafa;border:1px solid #d2d2d2}
h1{font-size:20px;margin:0 0 22px}input{display:block;width:100%;height:45px;margin:0 0 22px;padding:0 10px;border:1px solid #969696;font-size:15px}
button{width:100%;height:50px;border:0;background:#003087;color:#fff;font-size:16px;font-weight:700}
.l{height:10px;background:#c8c8c8;margin-top:20px}
</style></head>
<body><div class="top"><div class="logo">DemoBank</div></div>
<form class="card" method="post" action="/bank/session">
<h1>Log in to DemoBank</h1>
<input type="text" name="user" placeholder="Customer ID" autocomplete="username">
<input type="password" name="pass" placeholder="Password" autocomplete="current-password">
<button type="submit">Log in</button>
<div class="l" style="width:170px"></div><div class="l" style="width:230px"></div>
</form></body></html>
