<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishGuard playground</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --mute:#94a3b8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --acc:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:980px; margin:0 auto; padding:28px 18px 60px; }
  h1 { margin:0 0 4px; font-size:26px; } p.sub { margin:0 0 22px; color:var(--mute); }
  .row { display:flex; gap:10px; } input[type=text] { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #334155; background:#0b1220; color:var(--ink); font-size:15px; }
  button { padding:12px 20px; border:0; border-radius:10px; background:var(--acc); color:#06222f; font-weight:700; cursor:pointer; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-top:18px; }
  .verdict { display:flex; align-items:center; gap:16px; }
  .badge { padding:6px 14px; border-radius:999px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:13px; }
  .safe { background:#14532d; color:#bbf7d0; } .suspicious { background:#78350f; color:#fde68a; } .phishing { background:#7f1d1d; color:#fecaca; }
  .meter { flex:1; height:12px; background:#0b1220; border-radius:99px; overflow:hidden; } .meter > i { display:block; height:100%; }
  ul { padding-left:18px; margin:8px 0 0; } li { margin:4px 0; } li small { color:var(--mute); }
  .samples a { color:var(--acc); cursor:pointer; margin-right:12px; font-size:13px; white-space:nowrap; }
  svg { width:100%; height:auto; background:#0b1220; border-radius:10px; }
  .mute { color:var(--mute); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>PhishGuard playground</h1>
  <p class="sub">URL lexical analysis + lexical graph + homoglyph check (the same engine the browser extension calls).</p>
  <div class="row"><input id="u" type="text" placeholder="https://paypal.com.secure-login.xyz/verify" autofocus><button id="go">Analyze</button></div>
  <p class="samples mute" id="samples"></p>
  <div id="out"></div>
</main>
<script>
const samples = [
  "https://www.paypal.com/signin",
  "http://paypal.com.secure-login.xyz/verify",
  "https://xn--pypal-4ve.com",
  "https://paypa1-secure.com/login",
  "https://rnicrosoft.com/login",
  "https://sbi-kyc-update.in/verify",
  "http://paypal.com@evil.com/",
  "https://unipune-results.top/login"
];
const $ = id => document.getElementById(id);
$("samples").innerHTML = "Try: " + samples.map(s => `<a data-u="${s}">${s.replace(/^https?:\/\//,"")}</a>`).join("");
$("samples").addEventListener("click", e => { const u = e.target.dataset.u; if (u) { $("u").value = u; run(); } });
$("go").onclick = run; $("u").addEventListener("keydown", e => e.key === "Enter" && run());
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function run() {
  const url = $("u").value.trim(); if (!url) return;
  $("out").innerHTML = '<div class="card mute">Analyzing…</div>';
  try {
    const r = await fetch("/v1/analyze/url", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url, include_graph:true})});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || r.status);
    render(d);
  } catch (e) { $("out").innerHTML = '<div class="card">Error: ' + esc(e.message) + '</div>'; }
}

function render(d) {
  const col = {safe:"var(--ok)", suspicious:"var(--warn)", phishing:"var(--bad)"}[d.verdict];
  const reasons = d.reasons.map(x => `<li>${esc(x.message)} <small>(${esc(x.code)}${x.points ? ", +" + x.points : ""})</small></li>`).join("");
  $("out").innerHTML = `
    <div class="card"><div class="verdict"><span class="badge ${d.verdict}">${d.verdict}</span>
      <div class="meter"><i style="width:${Math.round(d.risk*100)}%;background:${col}"></i></div><b>${Math.round(d.risk*100)}%</b></div>
      <p class="mute">Registrable domain: <b>${esc(d.registrable_domain)}</b>${d.brand ? " · brand: <b>" + esc(d.brand) + "</b>" : ""} · ${d.timing_ms.total_ms} ms</p>
      <ul>${reasons || "<li>No suspicious signals.</li>"}</ul></div>
    <div class="card"><b>URL lexical graph</b> <span class="mute">(${d.graph.nodes.length} nodes, ${d.graph.edges.length} edges)</span>${graphSvg(d.graph)}</div>`;
}

function graphSvg(g) {
  const order = ["scheme","url","suffix","sld","subdomain","token","path","query"];
  const cols = {}; g.nodes.forEach(n => (cols[n.kind] = cols[n.kind] || []).push(n));
  const kinds = order.filter(k => cols[k]); const W = 900, colW = W / kinds.length;
  const maxN = Math.max(...kinds.map(k => cols[k].length)); const H = Math.max(240, maxN * 38 + 40);
  const pos = {}; kinds.forEach((k, ci) => cols[k].forEach((n, i) => { pos[n.id] = [colW * ci + colW / 2, (H / (cols[k].length + 1)) * (i + 1)]; }));
  const color = {url:"#38bdf8", scheme:"#64748b", suffix:"#a78bfa", sld:"#22c55e", subdomain:"#f59e0b", token:"#f472b6", path:"#94a3b8", query:"#94a3b8"};
  const lines = g.edges.map(([a,b]) => `<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" stroke="#475569" stroke-width="1.2"/>`).join("");
  const nodes = g.nodes.map(n => `<g><circle cx="${pos[n.id][0]}" cy="${pos[n.id][1]}" r="6" fill="${color[n.kind]}"/><text x="${pos[n.id][0]}" y="${pos[n.id][1] - 10}" font-size="12" text-anchor="middle" fill="#e2e8f0">${esc(n.label.slice(0,18))}</text></g>`).join("");
  const heads = kinds.map((k, ci) => `<text x="${colW * ci + colW / 2}" y="14" font-size="11" text-anchor="middle" fill="#94a3b8">${k}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}">${heads}${lines}${nodes}</svg>`;
}
</script>
</body>
</html>
